<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Outcome - Make a complaint</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head>
<body><header><strong>Northfield Health Board</strong></header>
<main>
<p class="steps">Step 3 of 4</p>
<h1>What you would like to happen</h1>
<form id="f" novalidate>
<div class="form-group"><label for="outcome">What outcome are you looking for?</label><textarea id="outcome" name="outcome"></textarea></div>
<div class="form-group"><fieldset class="form-group"><legend>How should we contact you?</legend>
<div class="radios"><input type="radio" id="c1" name="contact" value="email" required><label for="c1">By email</label>
<input type="radio" id="c2" name="contact" value="post"><label for="c2">By post</label>
<input type="radio" id="c3" name="contact" value="phone"><label for="c3">By phone</label></div></fieldset></div>
<div class="form-group"><label for="eth">Ethnic group (optional)</label><select id="eth" name="eth"><option value="">Select</option><option>Prefer not to say</option><option>White</option><option>Mixed</option><option>Asian</option><option>Black</option><option>Other</option></select></div>
<div class="form-group"><input type="checkbox" id="decl" name="decl" required><label for="decl" style="display:inline">I declare that the information I have given is true and complete</label></div>
<div class="form-group"><input type="checkbox" id="priv" name="priv"><label for="priv" style="display:inline">I agree that you may share my complaint with the staff involved, as set out in the privacy notice</label></div>
<button class="btn" type="submit">Continue</button>
</form>
</main>
<script>
wizard('f', 'review.html', [
  { id: 'c1', check: function () { return radio('contact') ? '' : 'Select how we should contact you'; } },
  { id: 'decl', check: function () { return document.getElementById('decl').checked ? '' : 'You must confirm the declaration'; } },
]);
</script></body></html>
