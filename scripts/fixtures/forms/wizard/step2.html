<!doctype html><html lang="en"><head><meta charset="utf-8"><title>What happened - Make a complaint</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head>
<body><header><strong>Northfield Health Board</strong></header>
<main>
<p class="steps">Step 2 of 4</p>
<h1>What happened</h1>
<form id="f" novalidate>
<div class="form-group"><label for="when">Date it happened</label><p class="hint">For example, 27/3/2026</p><input type="text" id="when" name="when"></div>
<div class="form-group"><label for="where">Which hospital or service?</label>
<select id="where" name="where"><option value="">Choose a hospital</option><option>Northfield Royal Infirmary</option><option>Eastbank Community Hospital</option><option>Northfield GP Out of Hours Service</option></select></div>
<div class="form-group"><fieldset class="form-group checks"><legend>Which departments were involved? (tick all that apply)</legend>
<input type="checkbox" id="d1" name="dept[]" value="ae"><label for="d1">Emergency department (A&amp;E)</label>
<input type="checkbox" id="d2" name="dept[]" value="op"><label for="d2">Outpatients</label>
<input type="checkbox" id="d3" name="dept[]" value="ward"><label for="d3">Hospital ward</label></fieldset></div>
<div class="form-group"><label for="details">Tell us what happened</label><textarea id="details" name="details"></textarea></div>
<div class="form-group"><label for="ref">Your case reference number (required)</label><p class="hint">This is on any letter we have sent you.</p><input type="text" id="ref" name="ref"></div>
<button class="btn" type="submit">Continue</button>
</form>
</main>
<script>
wizard('f', 'step3.html', [
  { id: 'when', check: function () { return /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(val('when')) ? '' : 'Enter the date it happened in the format DD/MM/YYYY'; } },
  { id: 'where', check: function () { return val('where') ? '' : 'Select a hospital or service'; } },
  { id: 'details', check: function () { return val('details').length >= 20 ? '' : 'Tell us what happened'; } },
  { id: 'ref', check: function () { return val('ref') ? '' : 'Enter your case reference number'; } },
]);
</script></body></html>
